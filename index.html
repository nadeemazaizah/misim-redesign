<style>
/* ---------- Tokens (skill B1 to B4) ---------- */
:root{
  --s-25:2px;--s-50:4px;--s-75:8px;--s-100:12px;--s-200:16px;--s-300:24px;--s-400:32px;--s-500:40px;--s-600:48px;--s-700:64px;--s-800:80px;--s-900:96px;
  --r-md:6px;--r-lg:8px;--r-xl:12px;--r-2xl:16px;--r-3xl:24px;--r-full:9999px;
  --bg:#FFFFFF;--surface:#F5F7FA;--ink:#0B1220;--muted:#5B6577;--line:#E3E8EF;
  --brand:#0A4FB0;--brand-ink:#083C86;--brand-soft:#EAF2FD;--sky:#38B6FF;
  --cta:#0E7A3E;--cta-hover:#0B6633;
  --ease:cubic-bezier(0.22,1,0.36,1);
  --font:"Manrope","Noto Sans Hebrew","Noto Sans Arabic",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:var(--s-900);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.5rem;font-weight:400;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
i.ph,i.ph-fill{display:inline-block;width:1em;height:1em;line-height:1;flex:none}
ul{padding:0;list-style:none}
h1,h2,h3,h4,.tagline{text-wrap:balance}
p,li,dd{text-wrap:pretty}
.ph,.ph-fill{font-style:normal;line-height:1}

/* ---------- Named text styles (skill B1) ---------- */
.heading-1{font-size:3.75rem;line-height:3.75rem;font-weight:600}
.heading-2{font-size:3rem;line-height:3rem;font-weight:600}
.heading-3{font-size:2.25rem;line-height:2.5rem;font-weight:600}
.heading-4{font-size:1.875rem;line-height:2.25rem;font-weight:600}
.heading-5{font-size:1.5rem;line-height:2rem;font-weight:600}
.heading-6{font-size:1.25rem;line-height:1.75rem;font-weight:600}
.title-1{font-size:1.25rem;line-height:1.75rem;font-weight:500}
.title-2{font-size:1.125rem;line-height:1.75rem;font-weight:500}
.title-3{font-size:1rem;line-height:1.5rem;font-weight:500}
.title-4{font-size:.875rem;line-height:1.25rem;font-weight:500}
.body-1{font-size:1rem;line-height:1.5rem;font-weight:600}
.body-2{font-size:1rem;line-height:1.5rem;font-weight:500}
.body-3{font-size:1rem;line-height:1.5rem;font-weight:400}
.body-4{font-size:.875rem;line-height:1.25rem;font-weight:600}
.body-6{font-size:.875rem;line-height:1.25rem;font-weight:400}
.button-lg{font-size:1.125rem;line-height:1.75rem;font-weight:600}
.button-md{font-size:1rem;line-height:1.5rem;font-weight:600}
.button-sm{font-size:.875rem;line-height:1.25rem;font-weight:600}
.caption-1{font-size:.875rem;line-height:1.25rem;font-weight:500}
.caption-3{font-size:.75rem;line-height:1rem;font-weight:600}
/* Arabic and Hebrew glyphs need taller line boxes than Latin at the same step */
:lang(ar) :is(.heading-1,.heading-2,.heading-3,.heading-4){line-height:1.3}
:lang(he) :is(.heading-1,.heading-2,.heading-3,.heading-4){line-height:1.15}
@media (min-width:768px){:is(:lang(ar),:lang(he)) .hero h1.heading-1{font-size:3rem}}

/* ---------- Layout ---------- */
.container{max-width:1152px;margin-inline:auto;padding-inline:var(--s-300)}
section{padding-block:var(--s-900)}
.surface{background:var(--surface)}
.eyebrow{display:inline-flex;align-items:center;gap:var(--s-75);color:var(--brand)}
.section-head{max-width:680px;display:grid;gap:var(--s-200);margin-block-end:var(--s-600)}
.section-head p{color:var(--muted)}
.muted{color:var(--muted)}

/* ---------- Buttons (skill B2, B9) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-75);padding:var(--s-75) var(--s-100);border-radius:var(--r-xl);border:1px solid transparent;text-decoration:none;cursor:pointer;font-family:inherit;white-space:nowrap;
  transition:transform 500ms var(--ease),background-color 300ms var(--ease),border-color 300ms var(--ease),color 300ms var(--ease)}
.btn .ph,.btn .ph-fill{font-size:1.25rem}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(0.98)}
.btn-primary{background:var(--cta);color:#fff}
.btn-primary:hover{background:var(--cta-hover)}
.btn-ghost{background:var(--bg);color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-lg{padding:var(--s-75) var(--s-200)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:var(--r-lg)}
.skip{position:absolute;inset-inline-start:var(--s-200);top:-100px;z-index:100;background:var(--ink);color:#fff;padding:var(--s-75) var(--s-100);border-radius:var(--r-xl);text-decoration:none}
.skip:focus{top:var(--s-200)}

/* ---------- Floating nav (skill B7 Navigation) ---------- */
.nav{position:fixed;top:var(--s-200);inset-inline:0;z-index:50;display:flex;justify-content:center;padding-inline:var(--s-200);pointer-events:none}
.nav-bar{pointer-events:auto;display:flex;align-items:center;gap:var(--s-300);padding:var(--s-75);padding-inline-start:var(--s-200);border-radius:var(--r-2xl);border:1px solid rgba(11,18,32,.08);
  background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 8px 32px rgba(11,18,32,.08)}
.brand{display:inline-flex;align-items:center;gap:var(--s-75);text-decoration:none;color:var(--ink)}
.brand img{width:32px;height:32px;border-radius:var(--r-lg)}
.brand b{font-weight:700}
.brand span{color:var(--sky)}
.nav-links{display:flex;gap:var(--s-50)}
.nav-links a{padding:var(--s-75) var(--s-100);border-radius:var(--r-lg);text-decoration:none;color:var(--muted);transition:background-color 300ms var(--ease),color 300ms var(--ease)}
.nav-links a:hover{background:rgba(11,18,32,.05);color:var(--ink)}
.nav-links a[aria-current="true"]{color:var(--ink);background:rgba(11,18,32,.06)}
.nav-tools{display:flex;align-items:center;gap:var(--s-50)}
.icon-btn{display:inline-grid;place-items:center;gap:var(--s-50);grid-auto-flow:column;min-width:40px;height:40px;padding-inline:var(--s-75);border-radius:var(--r-lg);border:0;background:transparent;color:var(--ink);cursor:pointer;font-family:inherit;
  transition:background-color 300ms var(--ease),transform 500ms var(--ease)}
.icon-btn:hover{background:rgba(11,18,32,.06)}
.icon-btn:active{transform:scale(0.98)}
.icon-btn .ph{font-size:1.25rem}
.pop{position:relative}
.menu{position:absolute;top:calc(100% + var(--s-75));inset-inline-end:0;min-width:200px;padding:var(--s-75);border-radius:var(--r-2xl);background:#fff;border:1px solid var(--line);box-shadow:0 16px 48px rgba(11,18,32,.12);display:grid;gap:var(--s-25);
  opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity 300ms var(--ease),transform 500ms var(--ease)}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu button,.menu a{display:flex;align-items:center;justify-content:space-between;gap:var(--s-100);width:100%;padding:var(--s-75) var(--s-100);border-radius:var(--r-lg);border:0;background:transparent;color:var(--ink);cursor:pointer;font-family:inherit;text-align:start;text-decoration:none;transition:background-color 300ms var(--ease)}
.menu button:hover,.menu a:hover{background:var(--surface)}
.menu [aria-pressed="true"],.menu [aria-current="true"]{background:var(--brand-soft);color:var(--brand)}
.menu .label{padding:var(--s-75) var(--s-100) var(--s-50);color:var(--muted)}
.toggle{display:none}
.toggle .bars{position:relative;width:20px;height:14px}
.toggle .bars i{position:absolute;inset-inline:0;height:2px;border-radius:2px;background:currentColor;transition:transform 500ms var(--ease),opacity 300ms var(--ease)}
.toggle .bars i:nth-child(1){top:2px}.toggle .bars i:nth-child(2){top:10px}
.nav.is-open .toggle .bars i:nth-child(1){transform:translateY(4px) rotate(45deg)}
.nav.is-open .toggle .bars i:nth-child(2){transform:translateY(-4px) rotate(-45deg)}
.panel{position:fixed;inset:0;z-index:40;padding:calc(var(--s-900) + var(--s-200)) var(--s-300) var(--s-400);display:flex;flex-direction:column;gap:var(--s-400);
  background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);opacity:0;pointer-events:none;transition:opacity 300ms var(--ease)}
.panel.open{opacity:1;pointer-events:auto}
.panel nav{display:grid;gap:var(--s-75)}
.panel nav a,.panel .panel-cta{opacity:0;transform:translateY(24px);transition:opacity 500ms var(--ease),transform 500ms var(--ease)}
.panel nav a{padding:var(--s-100) 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.panel.open nav a,.panel.open .panel-cta{opacity:1;transform:none}

/* ---------- Hero (skill B5) ---------- */
.hero{padding-block:calc(var(--s-900) + var(--s-700)) var(--s-800)}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:var(--s-700);align-items:center}
.hero-copy{display:grid;gap:var(--s-300);justify-items:start}
.hero h1{max-width:680px;padding-block:var(--s-50);background:linear-gradient(90deg,#000000,#666666);-webkit-background-clip:text;background-clip:text;color:transparent}
[dir="rtl"] .hero h1{background-image:linear-gradient(270deg,#000000,#666666)}
.hero .sub{max-width:680px;color:var(--muted)}
.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-200)}
.call-link{display:inline-flex;align-items:center;gap:var(--s-75);color:var(--muted);text-decoration:none;transition:color 300ms var(--ease)}
.call-link b{color:var(--ink);direction:ltr;unicode-bidi:isolate}
.call-link:hover{color:var(--ink)}
.proof{display:flex;flex-wrap:wrap;gap:var(--s-75) var(--s-300);color:var(--muted)}
.proof li{display:inline-flex;align-items:center;gap:var(--s-75)}
.proof .ph-fill{color:var(--brand);font-size:1.125rem}
.hero-visual{position:relative;justify-self:center;width:100%;max-width:420px}
.photo{padding:var(--s-75);border-radius:var(--r-3xl);background:#fff;border:1px solid var(--line);box-shadow:0 24px 64px rgba(11,18,32,.12)}
.photo img{border-radius:var(--r-2xl);aspect-ratio:4/4.4;object-fit:cover;object-position:top;width:100%}
.chip{position:absolute;display:flex;align-items:center;gap:var(--s-100);padding:var(--s-100) var(--s-200);border-radius:var(--r-2xl);background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 12px 32px rgba(11,18,32,.12)}
.chip-a{inset-inline-start:calc(-1 * var(--s-400));bottom:var(--s-600)}
.chip-b{inset-inline-end:calc(-1 * var(--s-300));top:var(--s-400)}
.chip .num{color:var(--brand)}
.chip .ico{display:grid;place-items:center;width:40px;height:40px;border-radius:var(--r-xl);background:var(--brand-soft);color:var(--brand);font-size:1.25rem}

/* ---------- Trust strip ---------- */
.trust{padding-block:0 var(--s-800)}
.trust ul{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-200)}
.trust li{display:flex;align-items:center;gap:var(--s-100);padding:var(--s-200) var(--s-300);border:1px solid var(--line);border-radius:var(--r-2xl)}
.trust .ph{font-size:1.5rem;color:var(--brand)}

/* ---------- Services ---------- */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-200)}
.card{display:grid;align-content:start;gap:var(--s-200);padding:var(--s-300);border-radius:var(--r-2xl);background:#fff;border:1px solid var(--line);transition:transform 500ms var(--ease),border-color 300ms var(--ease)}
.card:hover{transform:translateY(-4px);border-color:#C5D3E6}
.card .ico{display:grid;place-items:center;width:48px;height:48px;border-radius:var(--r-xl);background:var(--brand-soft);color:var(--brand);font-size:1.5rem}
.card.feature{background:var(--brand);border-color:var(--brand);color:#fff}
.card.feature .ico{background:rgba(255,255,255,.14);color:#fff}
.card.feature p{color:#DCE8FA}

/* ---------- Tagline reveal (skill B11) ---------- */
.tagline-sec{padding-block:calc(var(--s-900) + var(--s-400))}
.tagline{max-width:880px;margin-inline:auto;text-align:center}
.tagline .w{color:rgba(11,18,32,.28);transition:color 500ms var(--ease)}
.tagline .w.on{color:var(--ink)}

/* ---------- How it works ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-300);counter-reset:step}
.step{display:grid;gap:var(--s-200);padding:var(--s-300);border-radius:var(--r-2xl);background:#fff;border:1px solid var(--line)}
.step .n{display:grid;place-items:center;width:40px;height:40px;border-radius:var(--r-full);background:var(--ink);color:#fff}

/* ---------- About ---------- */
.about-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:var(--s-700);align-items:center}
.about-card{display:grid;gap:var(--s-300);padding:var(--s-400);border-radius:var(--r-3xl);background:var(--surface);border:1px solid var(--line)}
.logo-box{display:grid;place-items:center;min-height:160px;padding:var(--s-300);border-radius:var(--r-2xl);background:#fff;border:1px solid var(--line)}
.logo-box img{max-height:112px;width:auto}
.wordmark{display:none;align-items:center;gap:var(--s-100);direction:ltr;color:var(--brand)}
.wordmark img{width:56px;height:56px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-200)}
.stat{padding:var(--s-200);border-radius:var(--r-2xl);background:#fff;border:1px solid var(--line);display:grid;gap:var(--s-50)}
.stat .heading-3{color:var(--brand)}
.about-copy{display:grid;gap:var(--s-200)}
.about-copy .role{color:var(--brand)}
.checks{display:grid;gap:var(--s-100);margin-block-start:var(--s-75)}
.checks li{display:flex;gap:var(--s-100);align-items:center}
.checks .ph-fill{color:var(--cta);font-size:1.25rem}

/* ---------- Videos ---------- */
.videos{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-200)}
.video{position:relative;aspect-ratio:16/9;border-radius:var(--r-2xl);overflow:hidden;border:0;padding:0;cursor:pointer;background:#000}
.video img{width:100%;height:100%;object-fit:cover;transition:transform 500ms var(--ease),opacity 300ms var(--ease);opacity:.9}
.video:hover img{transform:scale(1.04);opacity:1}
.video .play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:var(--r-full);display:grid;place-items:center;background:rgba(255,255,255,.92);color:var(--ink);font-size:1.5rem;transition:transform 500ms var(--ease)}
.video:hover .play{transform:scale(1.08)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ---------- FAQ ---------- */
.faq-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:var(--s-700);align-items:start}
.faq-list{display:grid;gap:var(--s-100)}
.faq-list details{border:1px solid var(--line);border-radius:var(--r-2xl);background:#fff;transition:border-color 300ms var(--ease)}
.faq-list details[open]{border-color:#C5D3E6}
.faq-list summary{display:flex;justify-content:space-between;align-items:center;gap:var(--s-200);padding:var(--s-200) var(--s-300);cursor:pointer;list-style:none;border-radius:var(--r-2xl)}
.faq-list summary::-webkit-details-marker{display:none}
.faq-list summary .ph{font-size:1.25rem;transition:transform 500ms var(--ease);flex:none}
.faq-list details[open] summary .ph{transform:rotate(45deg)}
.faq-list .a{padding:0 var(--s-300) var(--s-300);color:var(--muted)}

/* ---------- Final CTA and contact ---------- */
.cta-card{display:grid;gap:var(--s-400);padding:var(--s-700);border-radius:var(--r-3xl);background:var(--ink);color:#fff}
.cta-card .section-head{margin:0}
.cta-card .section-head p{color:#A9B3C2}
.cta-card .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.24)}
.cta-card .btn-ghost:hover{border-color:#fff}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-200)}
.addr{display:grid;gap:var(--s-200);align-content:start;padding:var(--s-300);border-radius:var(--r-2xl);background:#1F1F1F}
.addr .row{display:flex;gap:var(--s-100);align-items:flex-start}
.addr .ph{font-size:1.5rem;color:var(--sky)}
.addr p.muted{color:#A9B3C2}
.map{border-radius:var(--r-2xl);overflow:hidden;min-height:240px;background:#1F1F1F}
.map iframe{width:100%;height:100%;min-height:240px;border:0;display:block}
.socials{display:flex;flex-wrap:wrap;gap:var(--s-75)}
.socials a{display:inline-flex;align-items:center;gap:var(--s-75);padding:var(--s-75) var(--s-100);border-radius:var(--r-xl);text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.16);transition:border-color 300ms var(--ease),transform 500ms var(--ease)}
.socials a:hover{border-color:#fff;transform:translateY(-2px)}
.socials .ph{font-size:1.25rem}

/* ---------- Footer ---------- */
footer{padding-block:var(--s-600);border-top:1px solid var(--line)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--s-200)}
.foot nav{display:flex;flex-wrap:wrap;gap:var(--s-200)}
.foot a,.foot button{color:var(--muted);text-decoration:none;background:none;border:0;padding:0;font:inherit;cursor:pointer;transition:color 300ms var(--ease)}
.foot a:hover,.foot button:hover{color:var(--ink)}

/* ---------- Mobile sticky CTA ---------- */
.mbar{display:none}

/* ---------- Accessibility panel and statement ---------- */
dialog{max-width:640px;width:calc(100% - var(--s-400));max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r-3xl);padding:var(--s-400);color:var(--ink)}
dialog::backdrop{background:rgba(11,18,32,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog h2{margin-block-end:var(--s-200)}
dialog h3{margin-block:var(--s-300) var(--s-75)}
dialog ul{list-style:disc;padding-inline-start:var(--s-300)}
dialog .x{float:inline-end}
html.a-c{--ink:#000;--muted:#000;--line:#000;--brand:#0000C8}
html.a-c .tagline .w{color:#000}
html.a-l main a,html.a-l footer a{text-decoration:underline!important;outline:2px solid #FFBF00;outline-offset:2px}
html.a-a *,html.a-a *::before,html.a-a *::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}

/* ---------- Scroll reveals (skill B7) ---------- */
.js .reveal{opacity:0;transform:translateY(32px);transition:opacity 700ms var(--ease),transform 700ms var(--ease)}
.js .reveal.in{opacity:1;transform:none}

/* ---------- Responsive ---------- */
@media (max-width:1080px){
  .nav-links{display:none}
  .toggle{display:inline-grid}
  .nav-cta{display:none}
  .cards{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .hero-grid,.about-grid,.faq-grid{grid-template-columns:1fr}

 body:"<p>Misim.me places great importance on providing equal, accessible service to everyone, including people with disabilities. Accessibility adjustments were made to meet the Equal Rights for Persons with Disabilities (Service Accessibility Adjustments) Regulations, 2013, and Israeli Standard SI 5568 (based on WCAG) at level AA.</p><h3 class='title-2'>Adjustments made</h3><ul><li>Full keyboard navigation and a skip to content link</li><li>Accessibility tools: text size, high contrast, link highlighting and stopping animations</li><li>Semantic headings and page landmarks</li><li>Alternative text for images</li><li>Arabic, Hebrew, English and Russian with correct text direction</li></ul><h3 class='title-2'>Accessibility inquiries</h3><p>Coordinator: Mohammad Masalha · <a href='mailto:accessibility@misim.me'>accessibility@misim.me</a> · 04 830 6000</p><p class='muted'>Last updated: 23.11.2026</p>"},
ru:{aw:"Инструменты доступности",f1:"Увеличить текст",f2:"Уменьшить текст",c:"Высокий контраст",l:"Выделить ссылки",a:"Остановить анимацию",rs:"Сбросить",stl:"Заявление о доступности",cl:"Закрыть",st_t:"Заявление о доступности",
 body:"<p>Misim.me уделяет большое внимание равному и доступному обслуживанию всех, включая людей с ограниченными возможностями. На сайте выполнены адаптации для соответствия Правилам равных прав людей с ограниченными возможностями (адаптация доступности услуг), 2013, и израильскому стандарту SI 5568 (на основе WCAG) уровня AA.</p><h3 class='title-2'>Выполненные адаптации</h3><ul><li>Полная навигация с клавиатуры и ссылка «Перейти к содержимому»</li><li>Инструменты: размер текста, высокий контраст, выделение ссылок и остановка анимации</li><li>Семантические заголовки и области страницы</li><li>Альтернативный текст для изображений</li><li>Арабский, иврит, английский и русский с правильным направлением текста</li></ul><h3 class='title-2'>Обращения по доступности</h3><p>Координатор: Мухаммад Масальха · <a href='mailto:accessibility@misim.me'>accessibility@misim.me</a> · 04 830 6000</p><p class='muted'>Последнее обновление: 23.11.2026</p>"}
};
const LOGO={ar:"assets/logo-ar.png",he:"assets/logo-he.png"};
const LANGS=["ar","he","en","ru"];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let LANG;

function pickLang(){
  const q=new URLSearchParams(location.search).get("lang");
  if(LANGS.includes(q))return q;
  try{const s=localStorage.getItem("lang");if(LANGS.includes(s))return s}catch(e){}
  return "ar";
}
function setMeta(sel,val){const m=$(sel);if(m)m.setAttribute("content",val)}

function render(l){
  LANG=l;const d=T[l],a=A[l],h=document.documentElement;
  h.lang=l;h.dir=(l==="ar"||l==="he")?"rtl":"ltr";
  const all={...d,...a};
  const tel=s=>s.replace(/04 830 6000/g,'<bdi dir="ltr">04 830 6000</bdi>');
  $$("[data-i]").forEach(e=>{const v=all[e.dataset.i];if(v!=null)e.innerHTML=tel(esc(v))});
  $$("[data-i-br]").forEach(e=>{e.innerHTML=esc(all[e.dataset.iBr]).replace(/\n/g,"<br>")});
  $$("[data-i-attr]").forEach(e=>{const[at,k]=e.dataset.iAttr.split(":");e.setAttribute(at,all[k])});
  document.title=d.title;
  setMeta('meta[name="description"]',d.desc);setMeta('meta[property="og:title"]',d.title);setMeta('meta[property="og:description"]',d.desc);
  $("#cards").innerHTML=d.s.map((x,i)=>`<article class="card"><span class="ico"><i class="ph ${ICONS[i]}" aria-hidden="true"></i></span><h3 class="title-2">${esc(x)}</h3></article>`).join("")
    +`<article class="card feature"><span class="ico"><i class="ph ph-rocket-launch" aria-hidden="true"></i></span><h3 class="title-2">${esc(d.lt)}</h3><p class="body-6">${esc(d.lp)}</p></article>`;
  $("#steps").innerHTML=d.steps.map((s,i)=>`<li class="step"><span class="n body-4">${i+1}</span><h3 class="heading-6">${esc(s[0])}</h3><p class="body-3 muted">${esc(s[1])}</p></li>`).join("");
  $("#faqList").innerHTML=d.faq.map(f=>`<details><summary class="title-3"><span>${esc(f[0])}</span><i class="ph ph-plus" aria-hidden="true"></i></summary><p class="a body-3">${tel(esc(f[1]))}</p></details>`).join("");
  $("#tagline").innerHTML=d.tag.split("\n").map(line=>line.split(" ").map(w=>`<span class="w">${esc(w)}</span>`).join(" ")).join("<br>");
  tagWords=$$("#tagline .w");updateTagline();
  $("#stmtB").innerHTML=tel(a.body);
  $("#heroPhoto").alt=`${d.ah}, ${d.role}`;
  $$(".video").forEach((v,i)=>v.setAttribute("aria-label",`${d.play} ${i+1}`));
  const lg=$("#logoImg");if(LOGO[l]){lg.src=LOGO[l];lg.style.display="block";$("#wordmark").style.display="none"}else{lg.style.display="none";$("#wordmark").style.display="flex"}
  const wa="https://wa.me/97248306000?text="+encodeURIComponent(d.msg);
  $$(".wa").forEach(x=>{x.href=wa;x.target="_blank";x.rel="noopener"});
  $("#langCode").textContent=l.toUpperCase();$("#langBtn").setAttribute("aria-label",`${l.toUpperCase()} ${d.lang||""}`.trim());
  $$("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  try{localStorage.setItem("lang",l)}catch(e){}
  const u=new URL(location.href);u.searchParams.set("lang",l);history.replaceState(null,"",u);
}

/* Popovers */
function bindPop(btn,menu){
  btn.addEventListener("click",e=>{e.stopPropagation();const open=!menu.classList.contains("open");closePops();if(open){menu.classList.add("open");btn.setAttribute("aria-expanded","true")}});
}
function closePops(){$$(".menu.open").forEach(m=>m.classList.remove("open"));$$("[aria-controls$='Menu']").forEach(b=>b.setAttribute("aria-expanded","false"))}
bindPop($("#langBtn"),$("#langMenu"));bindPop($("#a11yBtn"),$("#a11yMenu"));
document.addEventListener("click",e=>{if(!e.target.closest(".menu"))closePops()});
$$("[data-lang]").forEach(b=>b.addEventListener("click",()=>{render(b.dataset.lang);closePops()}));

/* Mobile menu: full height panel, staggered links (60ms steps, capped at 400ms) */
const nav=$("#nav"),panel=$("#panel"),tg=$("#toggle");
$$("#panel nav a, #panel .panel-cta").forEach((a,i)=>a.style.transitionDelay=Math.min(i*60,400)+"ms");
function setPanel(open){
  nav.classList.toggle("is-open",open);tg.setAttribute("aria-expanded",open);
  if(open){panel.hidden=false;requestAnimationFrame(()=>panel.classList.add("open"));document.body.style.overflow="hidden"}
  else{panel.classList.remove("open");document.body.style.overflow="";setTimeout(()=>{if(!panel.classList.contains("open"))panel.hidden=true},300)}
}
tg.addEventListener("click",()=>setPanel(!nav.classList.contains("is-open")));
$$("#panel a").forEach(a=>a.addEventListener("click",()=>setPanel(false)));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePops();if(nav.classList.contains("is-open"))setPanel(false)}});

/* Current section in nav */
const links=$$("#navLinks a");
const secIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+e.target.id))}),{rootMargin:"-45% 0px -50% 0px"});
$$("main section[id]").forEach(s=>secIO.observe(s));

/* Scroll reveals, once per section */
const revIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");revIO.unobserve(e.target)}}),{threshold:.12});
$$(".reveal").forEach(e=>revIO.observe(e));

/* Tagline reveal: words light up one by one, rAF throttled */
let tagWords=[],ticking=false;
const reduced=matchMedia("(prefers-reduced-motion: reduce)");
function updateTagline(){
  ticking=false;
  if(reduced.matches||document.documentElement.classList.contains("a-a")){tagWords.forEach(w=>w.classList.add("on"));return}
  const r=$("#tagline").getBoundingClientRect(),vh=innerHeight;
  const p=Math.min(1,Math.max(0,(vh*0.8-r.top)/(r.height+vh*0.35)));
  const n=Math.round(p*tagWords.length);
  tagWords.forEach((w,i)=>w.classList.toggle("on",i<n));
}
addEventListener("scroll",()=>{if(!ticking){ticking=true;requestAnimationFrame(updateTagline)}},{passive:true});
addEventListener("resize",updateTagline);

/* Mobile sticky CTA appears once the hero CTA leaves the screen */
const mbar=$("#mbar");
new IntersectionObserver(([e])=>mbar.classList.toggle("show",!e.isIntersecting&&e.boundingClientRect.top<0)).observe($("#heroCta"));

/* Lightweight YouTube facades */
$$(".video").forEach(v=>v.addEventListener("click",()=>{
  const f=document.createElement("iframe");
  f.src=`https://www.youtube-nocookie.com/embed/${v.dataset.yt}?autoplay=1`;f.allow="accelerometer;autoplay;encrypted-media;picture-in-picture";f.allowFullscreen=true;f.title=v.getAttribute("aria-label");
  const w=document.createElement("div");w.className="video";w.appendChild(f);
  v.replaceWith(w);
}));

/* Accessibility tools */
let S={f:0,c:0,l:0,a:0};try{Object.assign(S,JSON.parse(localStorage.getItem("a11y")||"{}"))}catch(e){}
function applyA11y(){
  const h=document.documentElement;["c","l","a"].forEach(k=>{h.classList.toggle("a-"+k,!!S[k]);const b=$(`[data-f="${k}"]`);if(b)b.setAttribute("aria-pressed",!!S[k])});
  h.style.fontSize=(100+S.f*12.5)+"%";try{localStorage.setItem("a11y",JSON.stringify(S))}catch(e){}updateTagline();
}
$$("[data-f]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.f;
  if(k==="f1")S.f=Math.min(4,S.f+1);else if(k==="f2")S.f=Math.max(-1,S.f-1);else if(k==="rs")S={f:0,c:0,l:0,a:0};else S[k]=S[k]?0:1;applyA11y()}));
const dlg=$("#stmt");$$("[data-open-stmt]").forEach(b=>b.addEventListener("click",()=>{closePops();dlg.showModal()}));$("#stmtX").addEventListener("click",()=>dlg.close());

render(pickLang());applyA11y();
</script>
</body>
</html>
